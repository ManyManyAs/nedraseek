# Конфигурация пайплайна PipeTwin.
seed: 42
paths:
  raw: data/raw
  out: outputs
  result: result.csv

# Кейс 1: прогноз между пропусками ВТД.
# ВНИМАНИЕ: целевой участок — гипотеза. Меняется здесь.
case1:
  target_id: 1250022871
  start_run: "2022-07-06"     # последний известный пропуск на целевом участке
  target_run: "2023-12-01"    # оцениваемый пропуск (известен на соседних участках)
  n_sim: 1000                 # число розыгрышей Монте-Карло
  match_tol_m: 0.08           # допуск при сопоставлении дефектов двух пропусков
  blend_w: 0.5                # вес 5-го перцентиля в итоговой смеси с моделью роста
  pos_sigma_m: 1.0            # нижняя граница СКО ошибки дистанции в середине целевого участка;
                              # фактическое значение берётся из проверки линейности сдвига (2018 → 2022)
  repair_prob: 0.8            # вероятность, что трубы с предписанием «врезка катушки» заменены до целевого пропуска
  # Независимая проверка на опорном участке
  val_blocks: 5               # число скрываемых блоков сегментов
  val_gap_m: 10               # зазор вокруг блока, исключаемый из оценки сдвига и закона роста
  val_pos_sigma_m: 0.25       # ошибка дистанции при интерполяции через один блок (десятки метров)

# Кейс 2: прогноз от ввода в эксплуатацию.
case2:
  target_id: 1250009583
  smooth_window_m: 1000       # окно сглаживания высотной отметки
  spread: 0.5                 # насколько отметка меняет потерю относительно средней; на r² не влияет
