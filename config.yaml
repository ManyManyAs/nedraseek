# Конфигурация пайплайна PipeTwin.
seed: 42
paths:
  raw: data/raw
  out: outputs
  result: result.csv

# Кейс 1: прогноз между пропусками ВТД.
# ВНИМАНИЕ: целевой участок — гипотеза. Меняется здесь.
case1:
  target_id: 1250022871
  start_run: "2022-07-06"     # последний известный пропуск на целевом участке
  target_run: "2023-12-01"    # оцениваемый пропуск (известен на соседних участках)
  n_sim: 1000                 # число розыгрышей Монте-Карло
  pos_sigma_m: 1.5            # СКО ошибки дистанции в середине участка
  match_tol_m: 0.08           # допуск при сопоставлении дефектов двух пропусков

# Кейс 2: прогноз от ввода в эксплуатацию.
case2:
  target_id: 1250009583
  mean_loss_frac: 0.10        # средняя потеря стенки; на r² не влияет, задаёт масштаб
  spread: 0.6                 # насколько рельеф меняет потерю относительно средней
